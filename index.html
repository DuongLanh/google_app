<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ứng dụng học toán</title>
<style>
  :root { --bg:#FFF6E9; --card:#fff; --ink:#3B2A20; --muted:#7a6656; --accent:#E67E22; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1914; --card:#2a221b; --ink:#f3e9df; --muted:#c2b2a2; --accent:#FFA65C; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 1.6rem; margin: 0 0 18px; }
  .card { display:block; background:var(--card); border-radius:18px; padding: 18px 20px; margin: 0 0 14px;
          box-shadow:0 2px 10px rgba(0,0,0,.06); color:inherit; text-decoration:none; }
  .card b { color: var(--accent); font-size: 1.15rem; }
  .card span { display:block; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Chính sách quyền riêng tư</h1>
<a class="card" href="toan-nhi/"><b>Toán Nhí: Toán Tư Duy Lớp 1-5</b><span>Ứng dụng luyện toán cho học sinh tiểu học</span></a>
<a class="card" href="toan-thcs/"><b>Toán THCS: Tư Duy Lớp 6-9</b><span>Ứng dụng luyện toán cho học sinh trung học cơ sở</span></a>
</main>
</body>
</html>
